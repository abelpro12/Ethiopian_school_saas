[pytest]
DJANGO_SETTINGS_MODULE = config.settings.testing
python_files = tests.py test_*.py *_tests.py
pythonpath = .
addopts = --import-mode=importlib
norecursedirs = scratch build dist .git venv .gemini node_modules
filterwarnings =
    # Filter known third-party DRF pagination notice on unsorted test querysets without premature module import
    ignore:.*Pagination may yield inconsistent results.*:UserWarning
    # Filter known external packaging deprecations while preserving all application warnings
    ignore::DeprecationWarning:distutils.*
    ignore::DeprecationWarning:pkg_resources.*
