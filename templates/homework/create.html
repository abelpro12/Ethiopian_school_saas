{% extends "base.html" %}
{% block title %}Post Homework{% endblock %}
{% block content %}

<div class="max-w-2xl mx-auto space-y-6">
  <div class="flex items-center gap-3">
    <a href="{% url 'homework:list' %}" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition">
      <i class="fa-solid fa-arrow-left text-sm"></i>
    </a>
    <div>
      <h1 class="font-heading text-xl font-bold text-slate-800">Post Homework Assignment</h1>
      <p class="text-xs text-slate-500">Create and assign homework to a specific section</p>
    </div>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
    <form method="post" enctype="multipart/form-data" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Assignment Title <span class="text-red-500">*</span></label>
        <input type="text" name="title" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition" required placeholder="e.g. Chapter 4 — Quadratic Equations">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Subject <span class="text-red-500">*</span></label>
          <select name="subject_id" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition" required>
            <option value="">— Select subject —</option>
            {% for sub in subjects %}<option value="{{ sub.id }}">{{ sub.name }} ({{ sub.code }})</option>{% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Target Section <span class="text-red-500">*</span></label>
          <select name="section_id" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition" required>
            <option value="">— Select section —</option>
            {% for sec in sections %}<option value="{{ sec.id }}">Grade {{ sec.grade.name }} - Section {{ sec.name }}</option>{% endfor %}
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Due Date <span class="text-red-500">*</span></label>
          <input type="date" name="due_date" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition" required min="{{ today }}">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Max Marks (optional)</label>
          <input type="number" name="max_marks" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition" value="10" min="0" step="0.5">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Description & Instructions <span class="text-red-500">*</span></label>
        <textarea name="description" rows="5" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition resize-none" required placeholder="Detail the questions, textbook pages, or expectations..."></textarea>
      </div>

      <div class="flex gap-3 pt-4 border-t border-slate-100">
        <button type="submit" class="flex items-center gap-2 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white font-semibold text-sm px-5 py-2.5 rounded-xl shadow-lg shadow-amber-500/25 transition">
          <i class="fa-solid fa-paper-plane text-xs"></i> Post Assignment
        </button>
        <a href="{% url 'homework:list' %}" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold text-sm px-4 py-2.5 rounded-xl transition">
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
