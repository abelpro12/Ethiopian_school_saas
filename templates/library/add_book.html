{% extends "base.html" %}
{% block title %}Add Book — Library{% endblock %}
{% block content %}

<div class="max-w-2xl mx-auto space-y-6">
  <div class="flex items-center gap-3">
    <a href="{% url 'library:catalog' %}" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition">
      <i class="fa-solid fa-arrow-left text-sm"></i>
    </a>
    <div>
      <h1 class="font-heading text-xl font-bold text-slate-800">Add Book to Library Catalog</h1>
      <p class="text-xs text-slate-500">Register new textbook, reference book, or fiction literature</p>
    </div>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Book Title <span class="text-red-500">*</span></label>
        <input type="text" name="title" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition" required placeholder="e.g. Grade 10 Physics Textbook">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Author</label>
          <input type="text" name="author" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition" placeholder="e.g. Dr. Tadesse">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">ISBN</label>
          <input type="text" name="isbn" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition" placeholder="e.g. 978-0-123456-78-9">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Category <span class="text-red-500">*</span></label>
          <select name="category" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition" required>
            {% for val, label in categories %}<option value="{{ val }}">{{ label }}</option>{% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Number of Copies</label>
          <input type="number" name="total_copies" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition" value="1" min="1" max="500">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Subject (optional)</label>
          <input type="text" name="subject" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition" placeholder="e.g. Mathematics, Chemistry">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Grade Level (optional)</label>
          <input type="text" name="grade_level" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition" placeholder="e.g. Grade 9-12">
        </div>
      </div>

      <!-- Immediate Borrow Option -->
      <div class="mt-6 pt-5 border-t border-slate-200 space-y-4 bg-sky-50/50 p-4 rounded-xl border border-sky-100">
        <div class="flex items-center justify-between">
          <label for="issue_checkbox" class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" name="issue_immediately" id="issue_checkbox" class="w-4 h-4 text-sky-600 rounded border-slate-300 focus:ring-sky-500">
            <span class="font-bold text-slate-800 text-sm">Issue / Borrow this book immediately upon creation</span>
          </label>
        </div>

        <div id="borrow_fields" class="hidden space-y-4 pt-3 border-t border-sky-100">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Filter by Grade</label>
              <select id="filter_grade" class="w-full bg-white border border-slate-200 text-slate-800 text-xs rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500">
                <option value="">— All Grades —</option>
                {% for grade in grades %}
                  <option value="{{ grade.id }}">{{ grade.name }} {% if grade.stream_type != 'GEN' %}({{ grade.get_stream_type_display }}){% endif %}</option>
                {% endfor %}
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Filter by Section</label>
              <select id="filter_section" class="w-full bg-white border border-slate-200 text-slate-800 text-xs rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500">
                <option value="">— All Sections —</option>
                {% for section in sections %}
                  <option value="{{ section.id }}" data-grade-id="{{ section.grade.id }}">{{ section.grade.name }} - {{ section.name }}</option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Select Student Borrower</label>
            <select name="student_id" id="student_select" class="w-full bg-white border border-slate-200 text-slate-800 text-xs rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500">
              <option value="">— Select Enrolled Student —</option>
              {% for student in students %}
                {% with enr=student.active_enrollments.0 %}
                <option value="{{ student.id }}" 
                        data-grade-id="{{ enr.grade.id|default:'' }}" 
                        data-section-id="{{ enr.section.id|default:'' }}">
                  {{ student.full_name }} {% if enr %}({{ enr.grade.name }} - {{ enr.section.name }}){% else %}(Not Enrolled){% endif %}
                </option>
                {% endwith %}
              {% endfor %}
            </select>
          </div>

          <div class="relative flex py-1 items-center">
            <div class="flex-grow border-t border-slate-200"></div>
            <span class="flex-shrink mx-3 text-[10px] font-bold text-slate-400 uppercase tracking-wider">OR Enter Custom / Staff Borrower</span>
            <div class="flex-grow border-t border-slate-200"></div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Borrower Name (Teacher, Staff, or External)</label>
            <input type="text" name="external_borrower_name" id="external_borrower_name" class="w-full bg-white border border-slate-200 text-slate-800 text-sm rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500" placeholder="e.g. Teacher Almaz, Staff Member">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Return Due Date</label>
            <input type="date" name="due_date" value="{{ default_due_date }}" class="w-full bg-white border border-slate-200 text-slate-800 text-sm rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500">
          </div>
        </div>
      </div>

      <div class="flex gap-3 pt-4 border-t border-slate-100">
        <button type="submit" class="flex items-center gap-2 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white font-semibold text-sm px-5 py-2.5 rounded-xl shadow-lg shadow-sky-500/25 transition">
          <i class="fa-solid fa-plus text-xs"></i> Save & Process Book
        </button>
        <a href="{% url 'library:catalog' %}" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold text-sm px-4 py-2.5 rounded-xl transition">
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const issueCheckbox = document.getElementById('issue_checkbox');
    const borrowFields = document.getElementById('borrow_fields');
    const gradeSelect = document.getElementById('filter_grade');
    const sectionSelect = document.getElementById('filter_section');
    const studentSelect = document.getElementById('student_select');

    if (!issueCheckbox || !borrowFields) return;

    issueCheckbox.addEventListener('change', function() {
      if (this.checked) {
        borrowFields.classList.remove('hidden');
      } else {
        borrowFields.classList.add('hidden');
      }
    });

    if (!gradeSelect || !sectionSelect || !studentSelect) return;

    const allSectionOptions = Array.from(sectionSelect.options).slice(1);
    const allStudentOptions = Array.from(studentSelect.options).slice(1);

    function filterSectionsAndStudents() {
      const selectedGradeId = gradeSelect.value;
      const selectedSectionId = sectionSelect.value;

      allSectionOptions.forEach(opt => {
        const matchesGrade = !selectedGradeId || opt.dataset.gradeId === selectedGradeId;
        opt.style.display = matchesGrade ? '' : 'none';
      });

      if (selectedGradeId && sectionSelect.selectedOptions[0] && sectionSelect.selectedOptions[0].dataset.gradeId !== selectedGradeId) {
        sectionSelect.value = '';
      }

      const activeSectionId = sectionSelect.value;

      allStudentOptions.forEach(opt => {
        const matchesGrade = !selectedGradeId || opt.dataset.gradeId === selectedGradeId;
        const matchesSection = !activeSectionId || opt.dataset.sectionId === activeSectionId;
        opt.style.display = (matchesGrade && matchesSection) ? '' : 'none';
      });

      if (studentSelect.selectedOptions[0] && studentSelect.selectedOptions[0].style.display === 'none') {
        studentSelect.value = '';
      }
    }

    gradeSelect.addEventListener('change', filterSectionsAndStudents);
    sectionSelect.addEventListener('change', filterSectionsAndStudents);
  });
</script>
{% endblock %}
