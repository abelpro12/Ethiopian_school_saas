{% if slot %}
<div class="h-full w-full relative {% if slot.is_locked %}bg-slate-100 border-l-4 border-slate-600{% elif slot.subject.is_core %}bg-amber-50/70 border-l-4 border-amber-500{% else %}bg-indigo-50/70 border-l-4 border-indigo-500{% endif %} rounded-xl p-2.5 text-left group shadow-xs hover:shadow-md transition-all cursor-grab active:cursor-grabbing"
     draggable="true"
     id="slot_{{ slot.id }}"
     ondragstart="handleDragStart(event, '{{ slot.id }}')"
     ondragover="handleDragOver(event)"
     ondrop="handleDrop(event, '{{ day }}', '{{ period.id }}', '{{ section.id }}')">

  <div class="flex items-start justify-between gap-1">
    <div class="font-bold text-slate-900 text-xs truncate flex items-center gap-1">
      {% if slot.subject.is_core %}
      <i class="fa-solid fa-star text-amber-500 text-[10px]" title="Core Subject"></i>
      {% endif %}
      <span>{{ slot.subject.name }}</span>
    </div>

    <!-- Lock indicator / toggle -->
    <button type="button"
            onclick="toggleSlotLock({{ slot.id }}, event)"
            title="{% if slot.is_locked %}Locked / Pinned Slot (Click to Unlock){% else %}Unlocked (Click to Pin){% endif %}"
            class="text-[10px] transition {% if slot.is_locked %}text-slate-700 bg-white shadow-xs px-1 py-0.5 rounded border border-slate-200{% else %}text-slate-300 hover:text-slate-600 opacity-0 group-hover:opacity-100{% endif %}">
      <i class="fa-solid {% if slot.is_locked %}fa-lock text-slate-800{% else %}fa-lock-open{% endif %}"></i>
    </button>
  </div>

  <div class="text-[11px] text-slate-600 mt-1 truncate flex items-center gap-1">
    <i class="fa-solid fa-user-tie text-[10px] text-slate-400"></i>
    <span>{{ slot.teacher.user.get_full_name|default:slot.teacher.user.username }}</span>
  </div>

  {% if slot.room %}
  <div class="text-[10px] text-indigo-600 mt-0.5 truncate flex items-center gap-1 font-mono">
    <i class="fa-solid fa-door-open text-[9px]"></i>
    <span>{{ slot.room }}</span>
  </div>
  {% endif %}

  <!-- Remove slot button -->
  <div class="absolute top-1 right-6 opacity-0 group-hover:opacity-100 transition-opacity">
    <button type="button"
            hx-post="{% url 'timetable:remove_slot' %}"
            hx-vals='{"slot_id": "{{ slot.id }}"}'
            hx-target="closest td"
            hx-confirm="Remove {{ slot.subject.name }} from this period?"
            class="text-rose-500 hover:text-rose-700 bg-white rounded-full p-1 shadow-sm h-5 w-5 flex items-center justify-center border border-slate-200 hover:border-rose-300">
      <i class="fa-solid fa-times text-[10px]"></i>
    </button>
  </div>
</div>
{% else %}
<div class="h-full w-full min-h-[75px] border-2 border-dashed border-slate-200/80 rounded-xl hover:border-brand-400 hover:bg-brand-50/30 transition-all flex items-center justify-center group cursor-pointer"
     ondragover="handleDragOver(event)"
     ondrop="handleDrop(event, '{{ day }}', '{{ period.id }}', '{{ section.id }}')"
     onclick="openAssignModal('{{ day }}', '{{ period.id }}', '{{ section.id }}')">
  <div class="text-center">
    <i class="fa-solid fa-plus text-slate-300 group-hover:text-brand-500 text-sm transition"></i>
    <span class="block text-[10px] font-bold text-slate-300 group-hover:text-brand-600 transition">Drop or Add</span>
  </div>
</div>
{% endif %}
